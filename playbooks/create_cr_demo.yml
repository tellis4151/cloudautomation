---
- name: Create ServiceNow Change Request
  hosts: localhost
  gather_facts: false

  tasks:
  - name: Create Change Request - Configure New Servers
    servicenow.itsm.change_request:
#      instance: 
#        host: "{{ host }}"
#        username: "{{ username }}"
#        password: "{{ password }}"
      type: standard
      state: new
      short_description: Configure new servers
      description: Install Security Patches, Register System, Install applicaton sofware, Enable FIPS
      priority: moderate
      category: network
      risk: low
      impact: low
      assignment_group: Network
