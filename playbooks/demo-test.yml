---
- name: Install LAMP Stack
  hosts: appservers
  tasks:
    - name: Install Apache
      ansible.builtin.dnf:
        name: httpd
        state: present
    - name: Install MySQL
      ansible.builtin.dnf:
        name: mariadb-server
        state: present
    - name: Install PHP
      ansible.builtin.dnf:
        name: php
        state: present
