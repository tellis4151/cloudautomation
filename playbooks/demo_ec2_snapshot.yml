---
- name: Simple AWS EBS Snapshot
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    volume_id: "{{ volume_id }}"
    aws_region: "us-east-1"

  tasks:
    - name: Create snapshot of specified volume
      amazon.aws.ec2_snapshot:
        volume_id: "{{ volume_id }}"
        region: "{{ aws_region }}"
        description: "Simple automated snapshot"
      register: snapshot_info

    - name: Show created snapshot ID
      ansible.builtin.debug:
        msg: "Snapshot created successfully: {{ snapshot_info.snapshot_id }}"
