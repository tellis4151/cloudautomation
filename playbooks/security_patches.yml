---
- name: Update security patches on RHEL servers
  hosts: rhel_servers
  gather_facts: false
  become: true

  tasks:
    - name: Register system
      ansible.builtin.command: subscription-manager register --username="{{ username }}" --password="{{ password }}" --auto-attach
      register: registration_output

    - name: Update security packages 
      dnf:
        name: "*"
        state: latest
        security: true
